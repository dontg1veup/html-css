<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 700px;
            border-collapse: collapse;
        }

        td , th  {
            border: 1px solid rgb(0, 0, 0);
            padding: 10px;
        }

        thead, tfoot {
            background-color: grey;
            color: white;
        }

        td.num {
            text-align: right;
        }

        caption {
            font-size: 1.5em;
            padding: 10px;
            background-color: darkgray;
            font-weight: bold;

        }

        .largura {
            width: 150px;
            
        }

        tr:nth-child(2n) {
            background-color: antiquewhite;
        }


    </style>    
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>
    <table>
        <caption>População das Unidades Federativas</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" class="largura">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>

            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">25 303 100</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">10 523 123</td>
            </tr>
            <tr>
                <td>Fortaleza</td>
                <td class="num">10 523 123</td>
            </tr>
            <tr>
                <td>Amapa</td>
                <td class="num">10 523 123</td>
            </tr>
            <tr>
                <td>Santa Catarina</td>
                <td class="num">10 523 123</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td class="num">0000</td>
            </tr>
        </tfoot>



    </table>
    
</body>
</html>

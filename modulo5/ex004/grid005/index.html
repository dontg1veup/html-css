<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    <style>
        div.container { 
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
           
            
            
        }
        div.caixa1 {
            border: 3px solid blue;
            grid-column: 1/-1;
            grid-row: 1/2;
            
        }
        div.caixa2 {
            border: 3px solid rgb(157, 255, 0);
            grid-column: 1/3;
            grid-row: 2/-1;
            
        }
        div.caixa3 {
            border: 3px solid rgb(255, 166, 0);
            grid-column: 3/-1;
            grid-row: 2/-1;
            
        }
    </style>
</head>
<body>
    
<div class="container">
    
    <div class="caixa1">

    </div>

    <div class="caixa2"></div>

    <div class="caixa3"></div>
    
    
    
    
</div>




</body>
</html>

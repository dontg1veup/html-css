<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    <style>
        div.container { 
            border: 3px solid red;
            height: 500px;
            display: grid;
            grid-template: repeat(3, 100px) / 100px 100px 100px;
            gap: 10px;
           place-items: end start;
           place-content: start end;
           
           
            
            
        }
        div.item {
            border: 3px solid blue;
            
        }
    </style>
</head>
<body>
    
<div class="container">
    <div class="item">a</div>
    <div class="item">b</div>
    <div class="item">c</div>
    <div class="item">a</div>
    <div class="item">b</div>
    <div class="item">c</div>
    <div class="item">a</div>
    <div class="item">b</div>
    
    
    
    
</div>




</body>
</html>

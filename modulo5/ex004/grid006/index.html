<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    
    <style>
        *{ 
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }
    .container {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-rows: 250px 100px 300px 300px 50px ;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        
    }

    .topo {
        grid-row: 1 / 2;
        grid-column: 1/-1;
        text-align: center;
        background-color: brown;
    }
    .menu{
        grid-row: 2/3;
        grid-column: 1/-1;
        background-color: red;
        text-align: center;
    }
    .principal {    
        grid-row: 3/5;
        grid-column: 1/-2;
        background-color: blue;
        text-align: center;
    }
    .secundario {
        grid-row: 3/-2;
        grid-column: 3/-1;
        background-color: yellow;
        text-align: center;
    }
    .rodape {
        grid-row: 5/-1;
        grid-column: 1/-1;
        background-color: blueviolet;
        text-align: center;
    }
    </style>
</head>
<body>
    
<div class="container">
    
    <div class="topo">topo</div>
    <div class="menu">menu</div>
    <div class="principal">principal</div>
    <div class="secundario">secundario</div>
    <div class="rodape">rodape</div>
    
    
    
    
</div>




</body>
</html>

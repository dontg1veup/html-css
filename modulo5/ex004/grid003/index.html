<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    <style>
        div.container { 
            border: 2px solid red;
            display: grid;
            grid-template: 1fr 2fr 3fr / 0.5fr 1fr 1.5fr;
            grid-auto-rows: 250px;
            height: 1000px;
            
        }
        div.item {
            border: 2px solid blue;
            padding: 5px;
        }
    </style>
</head>
<body>
    
<div class="container">
    <div class="item">a</div>
    <div class="item">b</div>
    <div class="item">c</div>
    <div class="item">a</div>
    <div class="item">b</div>
    <div class="item">c</div>
    <div class="item">a</div>
    <div class="item">b</div>
    <div class="item">c</div>
    <div class="item">a</div>
    
    
</div>




</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css" media="all">
    <link rel="stylesheet" href="estilo/mediaqueries.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=login" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key" />
    <title>Projeto Login</title>
</head>
<body>
    
<main> 

    <section id="login">
        <div id="imagem">
        </div>
        <div id="formulario">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Utilize o login para acessar sua conta e poder fazer seus ajustes no seu ambiente.</p>

            <form action="login.php" method="post" autocomplete="on">
            
                <div class="campo">  
                    <span class="material-symbols-outlined">login</span>                
                    <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail" autocomplete="email" required maxlength="30">
                    <label for="ilogin">Email</label>
                </div>

                <div>
                    <span class="material-symbols-outlined">key</span>
                    <input type="password" name="" id="isenha" placeholder="Digite sua Senha" autocomplete="current-password" required minlength="8">
                    <label for="isenha">Senha</label>
                </div>

                <input type="submit" value="Entrar">
                <input type="reset" value="Esqueci a senha">
                
            </form>
        </div>
    </section> 

</main>
</body>
</html>
